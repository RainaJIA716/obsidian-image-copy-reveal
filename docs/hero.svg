<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2B2A28" flood-opacity="0.10"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2B2A28" flood-opacity="0.14"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7A5AF8"/>
    </marker>

    <g id="ic-zoom"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4M11 8v6M8 11h6"/></g>
    <g id="ic-pencil"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
    <g id="ic-copy"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></g>
    <g id="ic-folder"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.5l-1.5 6a2 2 0 0 1-2 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/></g>
    <g id="ic-shrink"><path d="m15 15 6 6m-6-6v4.8m0-4.8h4.8"/><path d="M9 19.8V15m0 0H4.2M9 15l-6 6"/><path d="M15 4.2V9m0 0h4.8M15 9l6-6"/><path d="M9 4.2V9m0 0H4.2M9 9 3 3"/></g>
    <g id="ic-rename"><path d="M5 4h1a3 3 0 0 1 3 3 3 3 0 0 1 3-3h1"/><path d="M13 20h-1a3 3 0 0 1-3-3 3 3 0 0 1-3 3H5"/><path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1"/><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7"/><path d="M9 7v10"/></g>
  </defs>

  <rect width="900" height="600" rx="14" fill="#FAF8F4"/>

  <rect x="56" y="44" width="560" height="9" rx="4.5" fill="#DFD9CE"/>
  <rect x="56" y="65" width="404" height="9" rx="4.5" fill="#E7E2D9"/>

  <rect x="56" y="100" width="600" height="286" rx="10" fill="#FDFCF9" stroke="#E6E0D6" stroke-width="1.5" filter="url(#soft)"/>

  <g stroke="#2B2A28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 232 h86 v46 h-86 z"/>
    <path d="M300 178 h104 v44 h-104 z"/>
    <path d="M300 236 h104 v44 h-104 z"/>
    <path d="M300 294 h104 v44 h-104 z"/>
    <path d="M190 246 C 236 230, 262 214, 296 200"/>
    <path d="M190 256 h104"/>
    <path d="M190 266 C 236 282, 262 298, 296 312"/>
    <path d="M404 200 h100"/>
    <path d="M404 258 h100"/>
    <path d="M404 316 h100"/>
  </g>
  <g fill="#2B2A28">
    <path d="M296 194 l10 6 l-10 6 z"/><path d="M294 250 l10 6 l-10 6 z"/><path d="M296 306 l10 6 l-10 6 z"/>
    <path d="M504 194 l10 6 l-10 6 z"/><path d="M504 252 l10 6 l-10 6 z"/><path d="M504 310 l10 6 l-10 6 z"/>
  </g>
  <rect x="516" y="294" width="96" height="44" rx="2" fill="#EFEAFE" stroke="#2B2A28" stroke-width="3"/>

  <!-- toolbar, actual size, sitting in the image's top-right corner -->
  <g transform="translate(390,116)">
    <rect x="0" y="0" width="256" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.94" stroke="#E6E0D6" filter="url(#soft)"/>
    <rect x="82" y="6" width="168" height="32" rx="8" fill="#EFEAFE"/>
    <g stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#8A8580"><use href="#ic-zoom" x="10" y="10"/><use href="#ic-pencil" x="50" y="10"/></g>
      <g stroke="#7A5AF8">
        <use href="#ic-copy" x="90" y="10"/><use href="#ic-folder" x="130" y="10"/>
        <use href="#ic-shrink" x="170" y="10"/><use href="#ic-rename" x="210" y="10"/>
      </g>
    </g>
  </g>

  <path d="M700 176 C 684 176, 672 152, 652 140" stroke="#7A5AF8" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="698" y="182" font-size="16" font-weight="600" fill="#7A5AF8">four new buttons</text>
  <text x="698" y="206" font-size="14" fill="#8A8580">in the toolbar that</text>
  <text x="698" y="225" font-size="14" fill="#8A8580">Obsidian already</text>
  <text x="698" y="244" font-size="14" fill="#8A8580">draws for you</text>

  <!-- the same toolbar, magnified -->
  <g transform="translate(206,462)">
    <rect x="0" y="0" width="488" height="88" rx="20" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="1.5" filter="url(#lift)"/>
    <rect x="164" y="12" width="312" height="64" rx="14" fill="#EFEAFE"/>
    <g stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#8A8580">
        <use href="#ic-zoom"   transform="translate(20,20) scale(2)"/>
        <use href="#ic-pencil" transform="translate(100,20) scale(2)"/>
      </g>
      <g stroke="#7A5AF8">
        <use href="#ic-copy"   transform="translate(180,20) scale(2)"/>
        <use href="#ic-folder" transform="translate(260,20) scale(2)"/>
        <use href="#ic-shrink" transform="translate(340,20) scale(2)"/>
        <use href="#ic-rename" transform="translate(420,20) scale(2)"/>
      </g>
    </g>
  </g>

  <path d="M222 452 v-14 h140 v14" stroke="#C9C2B6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="292" y="428" text-anchor="middle" font-size="14" fill="#9A948B">built into Obsidian</text>

  <path d="M378 452 v-14 h300 v14" stroke="#7A5AF8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="528" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#7A5AF8">this plugin</text>

  <text x="292" y="576" text-anchor="middle" font-size="14" fill="#9A948B">zoom · edit</text>
  <text x="528" y="576" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2A28">copy · reveal in Finder · compress · rename</text>
</svg>
