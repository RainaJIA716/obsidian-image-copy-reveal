<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2B2A28" flood-opacity="0.10"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2B2A28" flood-opacity="0.14"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7A5AF8"/>
    </marker>
  </defs>

  <rect width="900" height="560" rx="14" fill="#FAF8F4"/>

  <!-- ── note context ─────────────────────────────────────────── -->
  <rect x="56"  y="44" width="560" height="9" rx="4.5" fill="#DFD9CE"/>
  <rect x="56"  y="65" width="404" height="9" rx="4.5" fill="#E7E2D9"/>

  <!-- image embed -->
  <rect x="56" y="100" width="600" height="286" rx="10" fill="#FDFCF9" stroke="#E6E0D6" stroke-width="1.5" filter="url(#soft)"/>

  <!-- a small hand-drawn-looking diagram standing in for the image -->
  <g stroke="#2B2A28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 232 h86 v46 h-86 z"/>
    <path d="M300 160 h104 v44 h-104 z"/>
    <path d="M300 232 h104 v44 h-104 z"/>
    <path d="M300 304 h104 v44 h-104 z"/>
    <path d="M190 246 C 236 226, 262 200, 296 184"/>
    <path d="M190 255 h104"/>
    <path d="M190 264 C 236 284, 262 310, 296 326"/>
    <path d="M404 182 h100"/>
    <path d="M404 254 h100"/>
    <path d="M404 326 h100"/>
  </g>
  <g fill="#2B2A28">
    <path d="M296 178 l10 6 l-10 6 z"/>
    <path d="M294 249 l10 6 l-10 6 z"/>
    <path d="M296 320 l10 6 l-10 6 z"/>
    <path d="M504 176 l10 6 l-10 6 z"/>
    <path d="M504 248 l10 6 l-10 6 z"/>
    <path d="M504 320 l10 6 l-10 6 z"/>
  </g>
  <g fill="#EFEAFE" stroke="#2B2A28" stroke-width="3">
    <rect x="516" y="304" width="96" height="44" rx="2"/>
  </g>

  <!-- ── the toolbar, in place ────────────────────────────────── -->
  <g transform="translate(452,116)">
    <rect x="0" y="0" width="180" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#E6E0D6" filter="url(#soft)"/>
    <g transform="translate(10,10)" stroke="#8A8580" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(0,0)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4M11 8v6M8 11h6"/></g>
      <g transform="translate(40,0)"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
    </g>
    <rect x="86" y="6" width="88" height="32" rx="8" fill="#EFEAFE"/>
    <g transform="translate(94,10)" stroke="#7A5AF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(0,0)"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></g>
      <g transform="translate(40,0)"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.5l-1.5 6a2 2 0 0 1-2 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/></g>
    </g>
  </g>

  <path d="M702 172 C 684 172, 668 152, 646 140" stroke="#7A5AF8" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="700" y="178" font-size="16" font-weight="600" fill="#7A5AF8">two new buttons</text>
  <text x="700" y="202" font-size="14" fill="#8A8580">in the toolbar that</text>
  <text x="700" y="221" font-size="14" fill="#8A8580">Obsidian already</text>
  <text x="700" y="240" font-size="14" fill="#8A8580">draws for you</text>

  <!-- ── magnified toolbar ───────────────────────────────────── -->
  <g transform="translate(210,438)">
    <rect x="0" y="0" width="360" height="88" rx="20" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="1.5" filter="url(#lift)"/>
    <g transform="translate(20,20)" stroke="#8A8580" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(0,0) scale(2)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4M11 8v6M8 11h6"/></g>
      <g transform="translate(80,0) scale(2)"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
    </g>
    <rect x="172" y="12" width="176" height="64" rx="14" fill="#EFEAFE"/>
    <g transform="translate(188,20)" stroke="#7A5AF8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(0,0) scale(2)"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></g>
      <g transform="translate(80,0) scale(2)"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.5l-1.5 6a2 2 0 0 1-2 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/></g>
    </g>
  </g>

  <!-- brackets + labels -->
  <path d="M228 424 v-14 h124 v14" stroke="#C9C2B6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="290" y="400" text-anchor="middle" font-size="14" fill="#9A948B">built into Obsidian</text>

  <path d="M400 424 v-14 h146 v14" stroke="#7A5AF8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="473" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#7A5AF8">this plugin</text>

  <text x="290" y="550" text-anchor="middle" font-size="14" fill="#9A948B">zoom · edit</text>
  <text x="473" y="550" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2A28">copy image · reveal in Finder</text>
</svg>
