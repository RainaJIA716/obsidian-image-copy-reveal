<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2B2A28" flood-opacity="0.10"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2B2A28" flood-opacity="0.14"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7A5AF8"/>
    </marker>

    <clipPath id="cardClip"><rect x="56" y="100" width="600" height="286" rx="10"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBE8D7"/>
      <stop offset="1" stop-color="#DFDCC8"/>
    </linearGradient>

    <g id="ic-zoom"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4M11 8v6M8 11h6"/></g>
    <g id="ic-pencil"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
    <g id="ic-copy"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></g>
    <g id="ic-folder"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.5l-1.5 6a2 2 0 0 1-2 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/></g>
    <g id="ic-trash"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6M14 11v6"/></g>
    <g id="ic-code"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></g>
    <g id="ic-scaling"><path d="M21 3 9 15"/><path d="M12 3H3v18h18v-9"/><path d="M16 3h5v5"/><path d="M14 15H9v-5"/></g>
    <clipPath id="phoneClip"><rect x="890" y="44" width="290" height="560" rx="36"/></clipPath>
    <g id="ic-archive"><path d="M10 12v-1"/><path d="M10 18v-2"/><path d="M10 7V6"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v16a2 2 0 0 0 .27 1"/><circle cx="10" cy="20" r="2"/></g>
    <g id="ic-rename"><path d="M5 4h1a3 3 0 0 1 3 3 3 3 0 0 1 3-3h1"/><path d="M13 20h-1a3 3 0 0 1-3-3 3 3 0 0 1-3 3H5"/><path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1"/><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7"/><path d="M9 7v10"/></g>
  </defs>

  <rect width="1240" height="640" rx="14" fill="#FAF8F4"/>
  <text x="56" y="30" font-size="13" font-weight="600" letter-spacing="1.5" fill="#9A948B">DESKTOP</text>
  <text x="890" y="30" font-size="13" font-weight="600" letter-spacing="1.5" fill="#9A948B">MOBILE</text>

  <rect x="56" y="44" width="560" height="9" rx="4.5" fill="#DFD9CE"/>
  <rect x="56" y="65" width="404" height="9" rx="4.5" fill="#E7E2D9"/>

  <rect x="56" y="100" width="600" height="286" rx="10" fill="#F7F3E8" stroke="#E4DCC8" stroke-width="1.5" filter="url(#soft)"/>

  <!-- Stands in for any image: a hand-drawn scene, warm and wordless, so it
       reads as "a picture" without asking to be read. Drawn on the left, since
       the toolbar lives in the top-right corner. -->
  <g clip-path="url(#cardClip)">
    <rect x="56" y="100" width="600" height="286" fill="#F7F3E8"/>
    <g transform="translate(56,100)" stroke="#20201D" stroke-width="2.2" fill="none"
       stroke-linecap="round" stroke-linejoin="round">

      <circle cx="70" cy="47" r="17" fill="#D9C6FB"/>
      <path d="M70 24v-9M86 31l6-6M93 47h9M86 63l6 6M70 70v9M54 63l-6 6M47 47h-9M54 31l-6-6"/>

      <path d="M168 53c-6 0-9-4-7-8 1-4 6-6 9-5 1-8 9-12 15-9 3-8 15-9 19-2 7-3 14 2 13 8
               5 1 7 5 5 9-2 5-8 7-12 7z"/>
      <path d="M104 114c-7-1-10-7-7-12 2-4 7-6 11-5 0-10 11-15 18-10 4-9 17-9 21-1
               8-2 15 4 13 11-1 6-7 9-12 9z"/>

      <path d="M45 181c-9-2-14-10-11-17-6-6-3-16 5-18 0-9 9-14 16-10 5-7 16-6 19 2
               9-1 15 8 11 15 6 5 4 15-4 17-2 7-11 10-17 6-5 6-14 6-19-1z"/>
      <path d="M56 179c1 18 1 36 0 54M63 181c-1 16-1 34 0 52M47 233c5-3 8-5 9-8M72 234c-5-3-8-5-9-9"/>

      <path d="M6 240c54-8 124-30 194-37 100-4 180 21 270 41 60 13 90 24 124 33"/>
    </g>
    <path d="M184 315c10-6 24-10 38-11 6 0 8 2 6 4-3 3-14 5-22 6-6 1-9 2-12 4-4 2-9 2-10-3z"
          fill="#CDB8F7"/>
  </g>

  <rect x="56" y="100" width="600" height="286" rx="10" fill="none" stroke="#E0D7C2" stroke-width="1.5"/>

  <!-- toolbar, actual size, sitting in the image's top-right corner -->
  <g transform="translate(350,116)">
    <rect x="0" y="0" width="296" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.94" stroke="#E6E0D6" filter="url(#soft)"/>
    <rect x="82" y="6" width="208" height="32" rx="8" fill="#EFEAFE"/>
    <g stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#8A8580"><use href="#ic-zoom" x="10" y="10"/><use href="#ic-pencil" x="50" y="10"/></g>
      <g stroke="#7A5AF8">
        <use href="#ic-rename" x="90" y="10"/><use href="#ic-archive" x="130" y="10"/>
        <use href="#ic-folder" x="170" y="10"/><use href="#ic-copy" x="210" y="10"/>
        <use href="#ic-trash" x="250" y="10"/>
      </g>
    </g>
  </g>

  <path d="M700 176 C 684 176, 672 152, 652 140" stroke="#7A5AF8" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="698" y="182" font-size="16" font-weight="600" fill="#7A5AF8">five new buttons</text>
  <text x="698" y="206" font-size="14" fill="#8A8580">in the toolbar that</text>
  <text x="698" y="225" font-size="14" fill="#8A8580">Obsidian already</text>
  <text x="698" y="244" font-size="14" fill="#8A8580">draws for you</text>

  <!-- the same toolbar, magnified -->
  <g transform="translate(120,462)">
    <rect x="0" y="0" width="568" height="88" rx="20" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="1.5" filter="url(#lift)"/>
    <rect x="164" y="12" width="392" height="64" rx="14" fill="#EFEAFE"/>
    <g stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#8A8580">
        <use href="#ic-zoom"   transform="translate(20,20) scale(2)"/>
        <use href="#ic-pencil" transform="translate(100,20) scale(2)"/>
      </g>
      <g stroke="#7A5AF8">
        <use href="#ic-rename"  transform="translate(180,20) scale(2)"/>
        <use href="#ic-archive" transform="translate(260,20) scale(2)"/>
        <use href="#ic-folder"  transform="translate(340,20) scale(2)"/>
        <use href="#ic-copy"    transform="translate(420,20) scale(2)"/>
        <use href="#ic-trash"   transform="translate(500,20) scale(2)"/>
      </g>
    </g>
  </g>

  <path d="M140 452 v-14 h128 v14" stroke="#C9C2B6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="204" y="428" text-anchor="middle" font-size="14" fill="#9A948B">built into Obsidian</text>

  <path d="M300 452 v-14 h368 v14" stroke="#7A5AF8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="484" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#7A5AF8">this plugin</text>

  <text x="204" y="576" text-anchor="middle" font-size="14" fill="#9A948B">zoom · edit</text>
  <text x="484" y="576" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2A28">rename · to WebP · reveal in Finder · copy · delete</text>

  <!-- mobile: the same toolbar shrinks to one button, and everything, Obsidian's
       own edit button included, moves into the menu it opens -->
  <rect x="890" y="44" width="290" height="560" rx="36" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="1.5" filter="url(#lift)"/>
  <g clip-path="url(#phoneClip)">
    <rect x="914" y="92" width="200" height="8" rx="4" fill="#DFD9CE"/>
    <rect x="914" y="110" width="140" height="8" rx="4" fill="#E7E2D9"/>
    <rect x="914" y="134" width="242" height="164" rx="8" fill="#F7F3E8" stroke="#E0D7C2" stroke-width="1.5"/>
    <g stroke="#20201D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="950" cy="170" r="12" fill="#D9C6FB"/>
      <path d="M916 268c40-8 80-22 120-24 50-2 80 10 118 22"/>
    </g>
    <circle cx="1128" cy="162" r="18" fill="#FFFFFF" stroke="#7A5AF8" stroke-width="2" filter="url(#soft)"/>
    <g fill="#7A5AF8"><circle cx="1120" cy="162" r="2.4"/><circle cx="1128" cy="162" r="2.4"/><circle cx="1136" cy="162" r="2.4"/></g>
    <rect x="914" y="314" width="190" height="8" rx="4" fill="#E7E2D9"/>

    <rect x="890" y="44" width="290" height="560" fill="#2B2A28" fill-opacity="0.10"/>
    <rect x="890" y="352" width="290" height="270" rx="24" fill="#FFFFFF"/>
    <rect x="1015" y="364" width="40" height="5" rx="2.5" fill="#D6D0C6"/>
    <g font-size="15" fill="#2B2A28">
      <text x="952" y="406">Edit link</text>
      <text x="952" y="454">Resize</text>
      <text x="952" y="502">Rename after this note</text>
      <text x="952" y="550" fill="#E5484D" font-weight="600">Delete image</text>
    </g>
    <g stroke="#EFEAE2" stroke-width="1.2"><path d="M914 424h242M914 472h242M914 520h242"/></g>
    <g stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#8A8580"><use href="#ic-code" x="914" y="389"/></g>
      <g stroke="#7A5AF8"><use href="#ic-scaling" x="914" y="437"/><use href="#ic-rename" x="914" y="485"/></g>
      <g stroke="#E5484D"><use href="#ic-trash" x="914" y="533"/></g>
    </g>
  </g>
  <text x="1035" y="630" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2A28">one button · everything in a menu</text>
</svg>
