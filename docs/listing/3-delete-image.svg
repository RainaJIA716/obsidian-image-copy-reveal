<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2B2A28" flood-opacity="0.10"/></filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2B2A28" flood-opacity="0.14"/></filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#7A5AF8"/></marker>
    <marker id="tipg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#B5AEA3"/></marker>
    <g id="ic-zoom"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4M11 8v6M8 11h6"/></g>
    <g id="ic-pencil"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
    <g id="ic-copy"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></g>
    <g id="ic-folder"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.5l-1.5 6a2 2 0 0 1-2 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/></g>
    <g id="ic-rename"><path d="M5 4h1a3 3 0 0 1 3 3 3 3 0 0 1 3-3h1"/><path d="M13 20h-1a3 3 0 0 1-3-3 3 3 0 0 1-3 3H5"/><path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1"/><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7"/><path d="M9 7v10"/></g>
    <g id="ic-archive"><path d="M10 12v-1"/><path d="M10 18v-2"/><path d="M10 7V6"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v16a2 2 0 0 0 .27 1"/><circle cx="10" cy="20" r="2"/></g>
    <g id="ic-trash"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6M14 11v6"/></g>
    <g id="ic-code"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></g>
    <g id="ic-scaling"><path d="M21 3 9 15"/><path d="M12 3H3v18h18v-9"/><path d="M16 3h5v5"/><path d="M14 15H9v-5"/></g>
    <g id="scene" stroke="#20201D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="70" cy="47" r="17" fill="#D9C6FB"/>
      <path d="M70 24v-9M86 31l6-6M93 47h9M86 63l6 6M70 70v9M54 63l-6 6M47 47h-9M54 31l-6-6"/>
      <path d="M168 53c-6 0-9-4-7-8 1-4 6-6 9-5 1-8 9-12 15-9 3-8 15-9 19-2 7-3 14 2 13 8 5 1 7 5 5 9-2 5-8 7-12 7z"/>
      <path d="M45 181c-9-2-14-10-11-17-6-6-3-16 5-18 0-9 9-14 16-10 5-7 16-6 19 2 9-1 15 8 11 15 6 5 4 15-4 17-2 7-11 10-17 6-5 6-14 6-19-1z"/>
      <path d="M56 179c1 18 1 36 0 54M63 181c-1 16-1 34 0 52"/>
      <path d="M6 240c54-8 124-30 194-37 100-4 180 21 270 41 60 13 90 24 124 33"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="#FAF8F4"/>
  <text x="60" y="84" font-size="40" font-weight="700" fill="#2B2A28">Delete an image, and its file only if unused</text>
  <text x="60" y="124" font-size="20" fill="#8A8580">Clean up attachments as you write, without breaking other notes.</text>
<rect x="60" y="250" width="250" height="140" rx="16" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="1.5" filter="url(#soft)"/><text x="185.0" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#2B2A28">Delete image</text><text x="185.0" y="314" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">toolbar button, or</text><text x="185.0" y="340" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">⋯ menu on mobile</text><path d="M318 320 H 372" stroke="#B5AEA3" stroke-width="2.5" marker-end="url(#tipg)"/><rect x="380" y="250" width="300" height="140" rx="16" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="1.5" filter="url(#soft)"/><text x="530.0" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#2B2A28">Link removed</text><text x="530.0" y="314" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">from the note.</text><text x="530.0" y="340" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">Undo brings it back.</text><path d="M688 320 H 742" stroke="#B5AEA3" stroke-width="2.5" marker-end="url(#tipg)"/><rect x="750" y="220" width="390" height="200" rx="16" fill="#EFEAFE" stroke="#D9CCFB" stroke-width="1.5" filter="url(#soft)"/><text x="945.0" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#2B2A28">Used anywhere else?</text><text x="945.0" y="284" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">other notes · rest of this note</text><text x="945.0" y="310" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">notes open with unsaved edits</text><text x="945.0" y="336" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">canvases</text><path d="M860 428 C 860 500, 600 500, 470 540" stroke="#B5AEA3" stroke-width="2.5" fill="none" marker-end="url(#tipg)"/><text x="690" y="488" font-size="17" font-weight="600" fill="#8A8580">yes</text><path d="M1030 428 C 1030 480, 1000 510, 960 540" stroke="#B5AEA3" stroke-width="2.5" fill="none" marker-end="url(#tipg)"/><text x="1036" y="490" font-size="17" font-weight="600" fill="#8A8580">no</text><rect x="200" y="550" width="420" height="150" rx="16" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="1.5" filter="url(#soft)"/><text x="410.0" y="588" text-anchor="middle" font-size="19" font-weight="700" fill="#2B2A28">File kept</text><text x="410.0" y="614" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">“Used in 2 more places”</text><text x="410.0" y="640" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">nothing that still needs it disappears</text><rect x="700" y="550" width="440" height="150" rx="16" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="1.5" filter="url(#soft)"/><text x="920.0" y="588" text-anchor="middle" font-size="19" font-weight="700" fill="#E5484D">File moved to the trash</text><text x="920.0" y="614" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">through Obsidian, so your own</text><text x="920.0" y="640" text-anchor="middle" font-size="16" font-weight="400" fill="#8A8580">delete settings decide where</text><text x="60" y="760" font-size="16" fill="#9A948B">When in doubt it counts the file as still used: a spare file is cheap, a missing one is not.</text>
</svg>
